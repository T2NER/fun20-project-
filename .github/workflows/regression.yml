name: Full Regression - 20 Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build 20 debug APKs + 20 release AABs + lint all 20
        run: |
          gradle \
            assembleTruthTapDebug assembleRoastButtonDebug assembleBsMeterDebug assembleFakeCallDebug assembleMostLikelyDebug assembleDareDropDebug assembleSettleItDebug assembleScreenCrackDebug assembleVoiceWarpDebug assemblePrankDeckDebug assembleAgeGuessDebug assembleFaceScoreDebug assembleBarkBackDebug assembleBabbleBackDebug assembleSpookyRadarDebug assembleSpinDecideDebug assembleAskOrbDebug assembleEscapeCallDebug assembleTapReflexDebug assemblePocketGuardDebug \
            bundleTruthTapRelease bundleRoastButtonRelease bundleBsMeterRelease bundleFakeCallRelease bundleMostLikelyRelease bundleDareDropRelease bundleSettleItRelease bundleScreenCrackRelease bundleVoiceWarpRelease bundlePrankDeckRelease bundleAgeGuessRelease bundleFaceScoreRelease bundleBarkBackRelease bundleBabbleBackRelease bundleSpookyRadarRelease bundleSpinDecideRelease bundleAskOrbRelease bundleEscapeCallRelease bundleTapReflexRelease bundlePocketGuardRelease \
            lintTruthTapDebug lintRoastButtonDebug lintBsMeterDebug lintFakeCallDebug lintMostLikelyDebug lintDareDropDebug lintSettleItDebug lintScreenCrackDebug lintVoiceWarpDebug lintPrankDeckDebug lintAgeGuessDebug lintFaceScoreDebug lintBarkBackDebug lintBabbleBackDebug lintSpookyRadarDebug lintSpinDecideDebug lintAskOrbDebug lintEscapeCallDebug lintTapReflexDebug lintPocketGuardDebug \
            --stacktrace
      - name: Verify artifact counts
        run: |
          APK_COUNT=$(find app/build/outputs/apk -name '*.apk' | wc -l)
          AAB_COUNT=$(find app/build/outputs/bundle -name '*.aab' | wc -l)
          echo "APKs=$APK_COUNT AABs=$AAB_COUNT"
          test "$APK_COUNT" -ge 20
          test "$AAB_COUNT" -ge 20
      - name: Collect artifacts
        run: |
          mkdir -p regression-artifacts/apks regression-artifacts/aabs
          find app/build/outputs/apk -name '*.apk' -exec cp {} regression-artifacts/apks/ \;
          find app/build/outputs/bundle -name '*.aab' -exec cp {} regression-artifacts/aabs/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: PlayFun20-builds
          path: regression-artifacts

  emulator-smoke:
    needs: build-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reuse APKs from verified build
        uses: actions/download-artifact@v4
        with:
          name: PlayFun20-builds
          path: regression-artifacts
      - name: Verify smoke-test APK set
        run: |
          APK_COUNT=$(find regression-artifacts/apks -name '*.apk' | wc -l)
          echo "Smoke-test APKs=$APK_COUNT"
          test "$APK_COUNT" -eq 20
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "No /dev/kvm device available; emulator runner will fall back to software acceleration."
          fi
      - name: Emulator smoke test all 20 apps
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eu
            timeout 60s adb wait-for-device
            for apk in $(find regression-artifacts/apks -name '*.apk' -print | sort); do echo "INSTALL $apk"; timeout 30s adb install -r "$apk"; done
            PASS=0
            for pkg in com.t2ner.truthtap com.t2ner.roastbutton com.t2ner.bsmeter com.t2ner.fakecallfun com.t2ner.mostlikelyparty com.t2ner.daredrop com.t2ner.settleit com.t2ner.screencrackprank com.t2ner.voicewarplite com.t2ner.prankdeck com.t2ner.ageguessfun com.t2ner.facescorefun com.t2ner.barkback com.t2ner.babbleback com.t2ner.spookyradar com.t2ner.spindecide com.t2ner.askorb com.t2ner.escapecall com.t2ner.tapreflex com.t2ner.pocketguardalarm; do echo "SMOKE $pkg"; timeout 8s adb logcat -c || true; timeout 15s adb shell monkey -p "$pkg" -c android.intent.category.LAUNCHER 1 >/dev/null; sleep 1; timeout 15s adb shell monkey -p "$pkg" --throttle 40 10 >/dev/null || true; sleep 1; if timeout 10s adb logcat -d '*:E' | grep -E 'FATAL EXCEPTION|AndroidRuntime' | grep -q "$pkg"; then echo "Crash detected in $pkg"; timeout 10s adb logcat -d '*:E' || true; exit 1; fi; timeout 10s adb shell am force-stop "$pkg" || true; PASS=$((PASS+1)); echo "PASS $PASS/20 $pkg"; done
            test "$PASS" -eq 20
            echo "SMOKE COMPLETE: 20/20 apps passed"
